name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -o -q "$(ls *.zip | head -n 1)" -d proj
          ROOT=$(dirname "$(find proj -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project folder: $ROOT"
          ls -la "$ROOT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FastFlashOTG-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
